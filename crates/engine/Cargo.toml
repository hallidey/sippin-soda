[package]
name = "sippin-soda-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rcgen = { version = "0.14", features = ["x509-parser"] }
keyring = "4"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
subtle = "2.6"
time = "0.3"
zeroize = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util", "fs"] }
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tempfile = "3"
async-compression = { version = "0.4", features = ["tokio", "gzip", "zlib", "brotli"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-platform-verifier = "0.7"

[dev-dependencies]
rustls-pemfile = "2"
sysinfo = "0.39"
